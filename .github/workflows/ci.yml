name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: nix develop --command task check
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Scan
        run: nix develop --command task scan
  # Builds every tool with Nix and, on pushes to main, pushes the results (and their
  # dependencies) to the binary cache, so other machines download instead of compile.
  # Needs the repository variable CACHIX_CACHE (the cache name) and the secret
  # CACHIX_AUTH_TOKEN; without them the build still runs and nothing is pushed.
  nix:
    name: nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
      - name: Build
        run: nix build .#pick .#pv .#files .#gu .#tb .#nu .#mdexport --print-build-logs
      - name: Flake check
        run: nix flake check --print-build-logs
