# Repeatable tasks. Hooks and CI call these, never the raw tools. Run inside the dev shell
# (`nix develop`).
version: "3"
tasks:
  default:
    desc: List the available tasks.
    silent: true
    cmds:
      - task --list
  setup:
    desc: Install the git hooks and fetch the Rust dependencies.
    cmds:
      - lefthook install
      - cargo fetch --locked
  fmt:
    desc: Format every file.
    cmds:
      - treefmt
  lint:
    desc: Run the linters.
    cmds:
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - statix check .
      - deadnix --fail .
      - rumdl check .
      - actionlint
      - typos
  test:
    desc: Run the tests.
    cmds:
      - cargo nextest run --workspace --locked --no-tests=pass
  scan:
    desc: Run the vulnerability scanners.
    cmds:
      - cargo deny check
      - osv-scanner scan source --lockfile Cargo.lock --config osv-scanner.toml
      - gitleaks git --no-banner
      # The excluded rules only flag temp dirs, `args_os`, `current_exe` and `unsafe`, which are
      # audit hints, not defects: temp dirs are test fixtures, `unsafe` is the macOS FFI code.
      - >-
        semgrep scan --config p/rust --metrics off --error --quiet --exclude-rule rust.lang.security.args-os.args-os --exclude-rule rust.lang.security.current-exe.current-exe --exclude-rule rust.lang.security.temp-dir.temp-dir --exclude-rule rust.lang.security.unsafe-usage.unsafe-usage
  check:
    desc: Check formatting, lint and test. CI and pre-push call this.
    cmds:
      - treefmt --fail-on-change
      - task: lint
      - task: test
