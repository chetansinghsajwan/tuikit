[package]
name = "tuikit-pick"
description = "Fuzzy picker for tuikit: files, stdin, grep and git sources with preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
name = "pick"

[features]
default = ["dev-tty"]
# Poll the keyboard with poll(2) on /dev/tty. crossterm's default (kqueue on macOS) cannot poll
# /dev/tty, so a picker whose stdin is not the terminal (candidates piped in, or none) got no
# keys on macOS. The editor embeds `pick` with its own terminal handling and turns this off.
dev-tty = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"], optional = true }
grep = "0.4.1"
ignore.workspace = true
nucleo = "0.5.0"
ratatui.workspace = true
tui-input.workspace = true
tuikit-git-core.workspace = true
tuikit-pv.workspace = true
tuikit-ui.workspace = true
