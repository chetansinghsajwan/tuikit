[package]
name = "tuikit-pv"
description = "File preview and rendering for tuikit: code, Markdown, images, media, documents, tables"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[lib]
name = "pv"

[dependencies]
calamine = "0.30"
csv = "1"
ignore.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
lofty = "0.22"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
mp4 = "0.14"
pulldown-cmark.workspace = true
ratatui.workspace = true
serde.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
toml.workspace = true
tuikit-git-core.workspace = true
tuikit-ui.workspace = true
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-width.workspace = true
