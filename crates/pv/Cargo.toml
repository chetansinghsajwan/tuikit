[package]
name = "pv"
version = "0.1.0"
edition = "2024"

[dependencies]
git-core = { version = "0.1.0", path = "../git-core" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-onig"] }
toml = "1.1.8"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
pulldown-cmark = { version = "0.13", default-features = false }
ui = { version = "0.1.0", path = "../ui" }
unicode-width = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
lofty = "0.22"
mp4 = "0.14"
