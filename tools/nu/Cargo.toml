[package]
name = "tuikit-nu"
description = "nu: network connections (Wi-Fi, Bluetooth) in the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "nu"
path = "src/lib.rs"

[[bin]]
name = "nu"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ratatui.workspace = true
tui-input.workspace = true
tuikit-nu-core.workspace = true
tuikit-ui.workspace = true

# Native macOS backends (CoreWLAN, IOBluetooth): always on for macOS builds.
[target.'cfg(target_os = "macos")'.dependencies]
tuikit-nu-core = { workspace = true, features = ["macos"] }
