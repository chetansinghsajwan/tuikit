[package]
name = "git-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
git-core = { version = "0.1.0", path = "../../crates/git-core" }
git-panel = { version = "0.1.0", path = "../../crates/git-panel" }
pv = { version = "0.1.0", path = "../../crates/pv" }
ratatui = "0.30.2"
tui-input = "0.15.5"
ui = { version = "0.1.0", path = "../../crates/ui" }

[[bin]]
name = "git-ui"
path = "src/main.rs"
