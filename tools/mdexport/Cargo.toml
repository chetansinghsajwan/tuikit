[package]
name = "tuikit-mdexport"
description = "mdexport: Markdown to PDF through Typst"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "mdexport"
path = "src/main.rs"

[lib]
name = "mdexport"
path = "src/lib.rs"

[dependencies]
fontdb = "0.23"
pulldown-cmark.workspace = true
serde.workspace = true
toml.workspace = true
typst = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
typst-pdf = "0.14"
